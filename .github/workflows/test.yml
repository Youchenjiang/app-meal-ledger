name: Tests

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, build, and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # --ignore-scripts: CI never commits, so the `prepare` hook installer is
        # unnecessary here; skipping lifecycle scripts hardens the install.
        run: npm ci --ignore-scripts

      # Same package.json scripts developers run locally, so local and CI
      # verification cannot drift. See docs/engineering/testing-policy.md.
      - name: Typecheck
        run: npm run typecheck

      # `npm run build` is `tsc -b && vite build` — proves the production
      # bundle compiles and builds, not just the type layer.
      - name: Production build
        run: npm run build

      - name: Unit and component tests
        run: npm test

  e2e:
    name: End-to-end flows and ledger layout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Browsers are not part of node_modules. Chromium is enough for the suites
      # in tests/e2e, which include the container-width layout sweep.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      # Traces, failure screenshots, and any baseline written on a first run are
      # the evidence for a failed layout assertion. A missing snapshot fails the
      # run and is written to the snapshots directory, so that path is uploaded
      # too: its contents are the Linux baselines this job compares against from
      # then on. See docs/testing/visual-regression.md.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results
            tests/e2e/ledger-layout.spec.ts-snapshots
          retention-days: 7
